[project]
name = "workflowval"
version = "0.0.1"
description = "Model-agnostic CLI agent that infers multi-step API workflows from an OpenAPI spec, tests them with pytest and triages every failure."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27",
    "litellm[mcp]>=1.83",  # Tool calls import mcp, which is only in this extra.
    "openapi-core>=0.19",
    "openapi-spec-validator>=0.7",
    "pydantic>=2.7",
    "pytest>=8",
    "ruff>=0.6",
    "typer>=0.12",
]

[project.scripts]
workflowval = "workflowval.cli:app"

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "mypy>=1.10",
    "pytest-cov>=5",
    "pytest-socket>=0.7",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflowval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"src/workflowval/gen/templates/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --disable-socket --allow-unix-socket -m 'not live'"
markers = ["live: calls a real model provider; needs an API key and is never run in CI"]

[tool.coverage.run]
branch = true
source = ["workflowval"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]
